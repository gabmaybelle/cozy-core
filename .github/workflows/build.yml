# Builds Cozy Core for Minecraft 1.20.1 on every push and pull request, then tests what it built:
# - build: regenerates the pack from vanilla 1.20.1's data and the wood mods, checks for recipe
#   clashes and block-making loops, checks the committed pack/ is what the generator makes (a
#   wood mod changing its recipes shows up here too), and builds the Fabric and Forge jars.
#   The downloads are attached as "Downloads".
# - load: real dedicated servers (Fabric, Forge and plain vanilla with the data pack), with and
#   without the wood mods, must load with no data errors.
# - game: the in-game test (fabric/src/gametest) plays through the rules and the Hearth Lantern
#   and clicks every stonecutter recipe in the real screen, with and without the wood mods (and
#   the decoration mods).
# - game (Forge): vanilla's test server runs the Forge jar's own checks (forge/src/gametest):
#   the rules both ways, the Hearth Lantern, the trades, and every recipe in pack/ being in the
#   game (no wood mods there: their Forge builds don't start in a dev run; the load tests cover them).
# The code is compiled for Java 17 (1.20.1's) by Java 25; the servers, games and Forge's tools run
# on Java 17 (1.20.1's Mixin can't read newer Java's classes), which Gradle finds by its environment variable.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # A pull request from a branch in this repo is already built by its push; only build forks' twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            25
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: vanilla 1.20.1 server
        run: |
          mkdir -p ~/mc
          url=$(curl -fsS https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id == "1.20.1").url')
          curl -fsSL -o ~/mc/server-bundler.jar "$(curl -fsS "$url" | jq -r '.downloads.server.url')"
          unzip -p ~/mc/server-bundler.jar META-INF/versions/1.20.1/server-1.20.1.jar > ~/mc/server-1.20.1.jar
      - name: wood mods
        run: node tools/fetch-test-mods.js ~/wood
      - name: the data pack
        run: |
          node tools/build.js ~/mc/server-1.20.1.jar ~/wood/mods | tee build.log
          grep -q "No recipe clashes or block-making loops found." build.log
      - name: the committed pack is what the generator makes
        run: |
          if [ -n "$(git status --porcelain pack)" ]; then
            git status --short pack | head -20
            echo "pack/ differs from the generator's output: run node tools/build.js and commit pack/ (or a wood mod changed its recipes)."
            exit 1
          fi
      - name: the mods
        run: |
          chmod +x ./gradlew
          ./gradlew build -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
          node tools/build.js --jars
          ls dist/
      - name: capture the downloads
        uses: actions/upload-artifact@v7
        with:
          name: Downloads
          path: dist/
      - name: keep the test inputs for the other jobs
        uses: actions/upload-artifact@v7
        with:
          name: test-inputs
          path: |
            ~/mc/server-bundler.jar
            ~/wood/mods/

  load:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: fabric, group: none, name: 'Fabric' }
          - { loader: fabric, group: A, name: 'Fabric with Biomes O'' Plenty and Ecologics' }
          - { loader: fabric, group: B, name: 'Fabric with Wilder Wild and Promenade' }
          - { loader: fabric, group: C, name: 'Fabric with Beautify' }
          - { loader: fabric, group: D, name: 'Fabric with Macaw''s' }
          - { loader: forge, group: none, name: 'Forge' }
          - { loader: forge, group: A, name: 'Forge with Biomes O'' Plenty' }
          - { loader: forge, group: B, name: 'Forge with Ecologics' }
          - { loader: forge, group: C, name: 'Forge with Beautify' }
          - { loader: forge, group: D, name: 'Forge with Macaw''s' }
          - { loader: vanilla, group: none, name: 'vanilla with the data pack' }
    name: load (${{ matrix.name }})
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            25
          distribution: 'microsoft'
      - name: the downloads
        uses: actions/download-artifact@v8
        with:
          name: Downloads
          path: dist/
      - name: the test inputs
        uses: actions/download-artifact@v8
        with:
          name: test-inputs
          path: ~/
      - name: load test
        timeout-minutes: 15
        run: JAVA="$JAVA_HOME_17_X64/bin/java" bash tools/ci-load-test.sh ${{ matrix.loader }} ${{ matrix.group }} ~/wood/mods

  game:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: none, name: 'vanilla wood' }
          - { group: A, name: 'with Biomes O'' Plenty and Ecologics' }
          - { group: B, name: 'with Wilder Wild and Promenade' }
          - { group: C, name: 'with Beautify' }
          - { group: D, name: 'with Macaw''s' }
    name: game (${{ matrix.name }})
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            25
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: the test inputs
        uses: actions/download-artifact@v8
        with:
          name: test-inputs
          path: ~/
      - name: this group's wood mods
        run: |
          mkdir -p ~/group
          for j in $(bash tools/group-jars.sh ${{ matrix.group }} ~/wood/mods); do cp ~/wood/mods/$j ~/group/; done
          ls ~/group
      - name: game test
        # The Macaw's group clicks about 1,600 recipes, about 6 minutes on a desktop.
        timeout-minutes: 40
        run: |
          chmod +x ./gradlew
          args="-Pexpect=$GITHUB_WORKSPACE/pack"
          if [ "${{ matrix.group }}" != none ]; then args="$args -PwoodMods=$HOME/group"; fi
          xvfb-run -a ./gradlew :fabric:runClientGameTest $args -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
      - name: capture the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Game test screenshots (${{ matrix.name }})
          path: fabric/build/run/clientGameTest/screenshots/
          if-no-files-found: ignore

  game-forge:
    needs: build
    runs-on: ubuntu-24.04
    name: game (Forge)
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            25
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: game test
        # A dedicated test server: no window, so no virtual display needed. The wood mods' Forge
        # builds don't start in a dev run, so they're only in the Forge load tests above.
        timeout-minutes: 20
        run: |
          chmod +x ./gradlew
          ./gradlew :forge:runGameTestServer -Pexpect=pack -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

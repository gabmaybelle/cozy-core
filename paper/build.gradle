// The Paper plugin: cozy-core-<version>-paper.jar, for servers that run Paper. It is written
// against the Paper API only (no Minecraft classes, no mixins, nothing from `common`), so one jar
// runs on every Paper build of its Minecraft version. The Hearth Lantern here is a vanilla
// lantern carrying the plugin's tag, and every rule is an event handler.
plugins {
	id 'xyz.jpenilla.run-paper' version "${run_paper_version}"
}

repositories {
	maven {
		name = 'papermc'
		url = 'https://repo.papermc.io/repository/maven-public/'
	}
}

dependencies {
	// Versions are in gradle.properties. The server provides the API at run time, so it isn't bundled.
	compileOnly "io.papermc.paper:paper-api:${project.paper_api_version}"
}

// The mod's data pack (recipes, trades, the advancements tab) goes inside the plugin as
// `datapack/`, and CozyCoreBootstrap has Paper turn it on at start-up. It is `pack/` without
// the wood-mod compat recipes (Paper has no modded woods), and with the two places that name the
// mod's own Hearth Lantern item changed: the tab shows a vanilla lantern, and "The kettle's on" is
// awarded by the plugin when a Hearth Lantern is crafted (HomeComforts), since the plugin's recipes
// aren't in the data pack.
def paperPack = tasks.register('paperPack', Sync) {
	from(rootProject.file('pack')) {
		exclude('**/compat/**')
		into('datapack')
	}
	into(layout.buildDirectory.dir('paperPack'))
	doLast { task ->
		def advancements = new File(task.destinationDir, 'datapack/data/cozy_core/advancement/cozy')
		def edit = { String name, Closure change ->
			def file = new File(advancements, name + '.json')
			def json = new groovy.json.JsonSlurper().parse(file)
			change(json)
			file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + '\n'
		}
		edit('root') { it.display.icon.id = 'minecraft:lantern' }
		edit('the_kettles_on') {
			it.display.icon.id = 'minecraft:lantern'
			it.criteria = [the_kettles_on: [trigger: 'minecraft:impossible']]
		}
	}
}

sourceSets.main.resources.srcDir(paperPack)

processResources {
	def version = project.version
	inputs.property "version", version
	// The blocks that drop themselves at home: the mod's own tag file, read by HomeComforts.
	from(rootProject.file('common/src/main/resources/data/cozy_core/tags/block/keeps_at_home.json'))
	filesMatching("paper-plugin.yml") {
		expand "version": version
	}
}

// `./gradlew :paper:runServer` downloads a Paper server into paper/run and starts it with the plugin
// (a console, no window). tools/paper-server-test.js is the test that checks the Hearth works.
tasks.named('runServer') {
	minecraftVersion '26.3'
}

tasks.named('jar') { archiveFileName = "${rootProject.name}-${project.version}-paper.jar" }
tasks.named('sourcesJar') { archiveFileName = "${rootProject.name}-${project.version}-paper-sources.jar" }

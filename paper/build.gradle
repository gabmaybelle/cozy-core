// The Paper plugin: cozy-core-<version>-paper.jar, for servers that run Paper. It is written
// against the Paper API only (no Minecraft classes, no mixins, nothing from `common`), so one jar
// runs on every Paper build of its Minecraft version. The Hearth Lantern here is a vanilla
// lantern carrying the plugin's tag, and every rule is an event handler.
plugins {
	id 'xyz.jpenilla.run-paper' version "${run_paper_version}"
}

repositories {
	maven {
		name = 'papermc'
		url = 'https://repo.papermc.io/repository/maven-public/'
	}
}

dependencies {
	// Versions are in gradle.properties. The server provides the API at run time, so it isn't bundled.
	compileOnly "io.papermc.paper:paper-api:${project.paper_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("plugin.yml") {
		expand "version": version
	}
}

// `./gradlew :paper:runServer` downloads a Paper server into paper/run and starts it with the plugin
// (a console, no window). tools/paper-server-test.js is the test that checks the Hearth works.
tasks.named('runServer') {
	minecraftVersion '26.3'
}

tasks.named('jar') { archiveFileName = "${rootProject.name}-${project.version}-paper.jar" }
tasks.named('sourcesJar') { archiveFileName = "${rootProject.name}-${project.version}-paper-sources.jar" }

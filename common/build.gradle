// Loader-neutral code. This project is compiled on its own so a Fabric or NeoForge import can't
// sneak in: only Minecraft, Mixin and the JDK are on the classpath. Nothing here ships as a jar;
// `fabric` and `neoforge` compile these sources into theirs.
plugins {
	id 'fabric-loom' version "${loom_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.1 ships obfuscated: the code is written in the official Mojang names and Loom remaps.
	mappings loom.officialMojangMappings()
	// Only for the Mixin annotations and the launch-side classes they need. No Fabric API here.
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

loom {
	// Compile-only: see the file. The loader projects don't use it.
	accessWidenerPath = file('cozy_core-common.accesswidener')
	mods {
		"cozy_core" {
			sourceSet sourceSets.main
		}
	}
}

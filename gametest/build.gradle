// Game tests for Cozy Core (this repo). Nothing here ships: this project only
// starts a real Fabric game with the Cozy Core jar and plays through things a data pack can't test
// on its own, starting with the stonecutter screen.
//
//   ./gradlew runClientGameTest                      the jar in ../dist (run node tools/build.js first), vanilla wood
//   ./gradlew runClientGameTest -PcozyJar=<jar>      another Cozy Core jar
//   ./gradlew runClientGameTest -PwoodMods=<folder>  also load every jar in that folder (wood mods
//                                                    and their libraries), so their recipes are tested
//   ./gradlew runClientGameTest -Pexpect=<pack dir>  take the expected recipes from a pack folder (such
//                                                    as ../pack) instead of the jar, so a jar
//                                                    that's missing recipes fails too
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def cozyJar = project.findProperty("cozyJar") ?: fileTree("../dist") { include "cozy-core-*-fabric-neoforge.jar" }.files.sort { it.lastModified() }.last()

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// The pack under test, loaded as the code-free mod it ships as.
	runtimeOnly files(cozyJar)
	if (project.hasProperty("woodMods")) {
		runtimeOnly fileTree(project.woodMods) { include "*.jar" }
	}
}

// Where the test reads the expected recipes from (default: the Cozy Core jar itself).
tasks.withType(JavaExec).configureEach {
	if (project.hasProperty("expect")) {
		systemProperty "cozy.expect", file(project.expect).absolutePath
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "cozy_core_gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

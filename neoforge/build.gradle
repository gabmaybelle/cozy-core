plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

// The common sources and the generated data pack (pack/) are compiled straight into this jar,
// the same as the Fabric side.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
	resources.srcDir rootProject.file('pack')
}

// The game tests (src/gametest) are a mod of their own, loaded only by runGameTestServer below;
// nothing in them ships in the jar.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

neoForge {
	version = project.neoforge_version
	addModdingDependenciesTo(sourceSets.gametest)

	mods {
		"cozy_core" {
			sourceSet sourceSets.main
		}
		"cozy_core_gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		client {
			client()
			loadedMods = [mods.cozy_core]
		}
		server {
			server()
			programArgument '--nogui'
			loadedMods = [mods.cozy_core]
		}
		// Server game tests: `./gradlew :neoforge:runGameTestServer` starts vanilla's test server
		// (a flat world, no window) and runs the checks in src/gametest: the rules both ways, the
		// Hearth Lantern, and that every recipe in pack/ is in the game. It exits non-zero if one fails.
		//   -Pexpect=<pack dir>  take the expected recipes from another pack folder (default: pack/)
		//   -PwoodMods=<folder>  also load every jar in that folder (a group from tools/neoforge-group.sh)
		//   -PexpectMods=<ids>   comma-separated mod ids that must be loaded, so a group whose jars
		//                        didn't load fails instead of passing with its recipes "waiting"
		gameTestServer {
			type = 'gameTestServer'
			loadedMods = [mods.cozy_core, mods.cozy_core_gametest]
			programArguments.addAll('--tests', 'cozy_core_gametest:*')
			systemProperty 'cozy.expect', rootProject.file(project.hasProperty('expect') ? project.expect : 'pack').absolutePath
			systemProperty 'cozy.expectMods', project.findProperty('expectMods') ?: ''
		}
	}
}

// `-PwoodMods=<folder>`: the wood mods' jars (and their libraries) join the game test's run.
if (project.hasProperty('woodMods')) {
	dependencies {
		runtimeOnly fileTree(project.woodMods) { include '*.jar' }
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	// The mod icon is Gabby's own sprite (art/icon.ase exported at 512x512); the jar carries it as icon.png.
	from(rootProject.file('art/icon.png'))

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version
	}
}

// cozy-core-<version>-neoforge.jar, the name players download (tools/ci-load-test.sh looks for it in dist/).
tasks.named('jar') { archiveFileName = "${rootProject.name}-${project.version}-neoforge.jar" }
tasks.named('sourcesJar') { archiveFileName = "${rootProject.name}-${project.version}-neoforge-sources.jar" }

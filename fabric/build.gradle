plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The common sources and the generated data pack (pack/) are compiled straight into this jar,
// so the Fabric mod is one file and Loom can add the mixin refmap the common mixins need.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
	resources.srcDir rootProject.file('pack')
}

loom {
	mods {
		"cozy_core" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// `-PwoodMods=<folder>`: also load every jar in that folder (wood mods and their libraries)
	// in the game test, so their recipes are tested too.
	if (project.hasProperty("woodMods")) {
		runtimeOnly fileTree(project.woodMods) { include "*.jar" }
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	// The mod icon is Gabby's own sprite (art/icon.ase exported at 512x512); the jar carries it as icon.png.
	from(rootProject.file('art/icon.png'))

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// cozy-core-<version>-fabric.jar, the name players download (tools/ci-load-test.sh looks for it in dist/).
tasks.named('jar') { archiveFileName = "${rootProject.name}-${project.version}-fabric.jar" }
tasks.named('sourcesJar') { archiveFileName = "${rootProject.name}-${project.version}-fabric-sources.jar" }

// Client game tests: `./gradlew :fabric:runClientGameTest` starts a real game and plays through
// the checks in src/gametest (the rules, the Hearth Lantern and every stonecutter recipe).
// Nothing there ships in the jar.
//   -PwoodMods=<folder>  also load those jars (see above)
//   -Pexpect=<pack dir>  take the expected stonecutter recipes from a pack folder (such as
//                        ../pack) instead of the mod's own data, so a jar missing recipes fails too
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "cozy_core_gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

//
// `./gradlew :fabric:runClientGameTest -PvideoTour` also films the Short (VideoTour), frames in
// build/run/clientGameTest/video_tour. Every other -Pvideo... property is passed on to it:
// -PvideoScenes=<scene,scene,w_*> films only those scenes, -PvideoScout takes one still per scene,
// -PvideoSeed=<seed> picks the world, -PvideoWorld=<zip> films in a saved world, -PvideoStage
// saves the staged world. Without -PvideoTour the game test runs as usual.
if (project.hasProperty("videoTour")) {
	tasks.matching { it.name == 'runClientGameTest' }.configureEach {
		systemProperty 'cozycore.videoTour', 'true'
		// -PvideoShaders=<shader pack zip>: film with that Iris shader pack switched on (Iris and
		// Sodium come in with -PwoodMods=<folder of jars>). Copied into the run folder before launch,
		// since Iris reads its settings as the game starts.
		if (project.hasProperty('videoShaders')) {
			def pack = file(project.videoShaders)
			// The game's own folder, where Iris looks (the task's working directory is the project
			// folder, and shaders copied there were never picked up).
			def run = file('build/run/clientGameTest')
			doFirst {
				copy { from pack; into new File(run, 'shaderpacks') }
				def config = new File(run, 'config/iris.properties')
				config.parentFile.mkdirs()
				config.text = "enableShaders=true\nshaderPack=${pack.name}\n"
			}
		}
		project.properties.each { name, value ->
			if (name.startsWith('video') && name != 'videoTour') {
				// A bare flag (-PvideoScout) arrives empty: pass it on as true.
				systemProperty "cozycore.${name}", value.toString().isEmpty() ? 'true' : value.toString()
			}
		}
	}
}

tasks.withType(JavaExec).configureEach {
	if (project.hasProperty("expect")) {
		// Relative to the repo root, so `-Pexpect=pack` works from anywhere.
		systemProperty "cozy.expect", rootProject.file(project.expect).absolutePath
	}
}
